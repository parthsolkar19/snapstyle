<!-- Simple interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadZone = document.getElementById('upload-zone');
            const previewZone = document.getElementById('preview-zone');
            const btnDemo = document.getElementById('btn-demo-image');
            const btnReset = document.getElementById('btn-reset');
            const btnBrowse = document.getElementById('btn-browse');
const imageInput = document.getElementById('imageInput');
btnBrowse.addEventListener('click', () => {
    imageInput.click();
});
imageInput.addEventListener('change', (event) => {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
        const imageData = reader.result;

        previewZone.querySelector('img').src = imageData;

        uploadZone.classList.add('hidden');
        previewZone.classList.remove('hidden');

        previewZone.style.opacity = '1';
        previewZone.style.transform = 'translateY(0)';

        previewZone.dataset.imageData = imageData;
    };

    reader.readAsDataURL(file);
});
const btnAnalyze = document.getElementById('btn-analyze');
btnAnalyze.addEventListener('click', async () => {

    const image = previewZone.querySelector('img').src;

    btnAnalyze.disabled = true;
    btnAnalyze.innerText = 'Analyzing...';

    try {

        const response = await fetch('http://localhost:3000/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                image: image
            })
        });

        const data = await response.json();

console.log('AI Result:', data);
console.log("FULL AI RESPONSE:", data);

if (!response.ok) {

    if (response.status === 503) {
        alert('Gemini is temporarily busy. Automatic retries failed. Please try again.');
    } else {
        alert(data.details || data.error || 'AI analysis failed.');
    }

    return;
}

if (data.result !== undefined) {

            const cleanResult = data.result
    .replace(/```json/g, '')
    .replace(/```/g, '')
    .trim();

const analysis = JSON.parse(cleanResult);
            console.log('Parsed Items:', analysis.items);
            localStorage.setItem(
    'snapstyleAnalysis',
    JSON.stringify(analysis)
);

window.location.href = '../snapstyle_detected_items/code.html';

            

        } else {
            alert('AI did not return any items.');
        }

    } catch (error) {

        console.error(error);
        alert('AI analysis failed. Check the console.');

    }

    btnAnalyze.disabled = false;
    btnAnalyze.innerText = 'Analyze My Look';

});
console.log("Analyze button found:", btnAnalyze);

            btnDemo.addEventListener('click', () => {
                // Hide Upload Zone
                uploadZone.style.opacity = '0';
                uploadZone.style.transform = 'translateY(-20px)';
                
                setTimeout(() => {
                    uploadZone.classList.add('hidden');
                    // Show Preview Zone
                    previewZone.classList.remove('hidden');
                    
                    // Trigger reflow for animation
                    void previewZone.offsetWidth;
                    
                    previewZone.style.opacity = '1';
                    previewZone.style.transform = 'translateY(0)';
                }, 300);
            });

            btnReset.addEventListener('click', () => {
                 // Hide Preview Zone
                 previewZone.style.opacity = '0';
                 previewZone.style.transform = 'translateY(20px)';
                 
                 setTimeout(() => {
                     previewZone.classList.add('hidden');
                     // Show Upload Zone
                     uploadZone.classList.remove('hidden');
                     
                     // Trigger reflow
                     void uploadZone.offsetWidth;
                     
                     uploadZone.style.opacity = '1';
                     uploadZone.style.transform = 'translateY(0)';
                 }, 300);
            });
        });

        // Add scanline animation to tailwind config dynamically for the specific effect
        tailwind.config.theme.extend.keyframes = {
            scan: {
                '0%': { top: '0%' },
                '50%': { top: '100%' },
                '100%': { top: '0%' },
            }
        };
    </script>
