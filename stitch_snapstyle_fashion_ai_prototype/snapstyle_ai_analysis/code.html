<style>
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(26, 26, 26, 0.8);
            box-shadow: 0 0 10px rgba(26, 26, 26, 0.5);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .focus-bracket {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #1A1A1A;
            transition: all 0.3s ease;
        }

        .bracket-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
        .bracket-tr { top: 16px; right: 16px; border-left: none; border-bottom: none; }
        .bracket-bl { bottom: 16px; left: 16px; border-right: none; border-top: none; }
        .bracket-br { bottom: 16px; right: 16px; border-left: none; border-top: none; }

        .image-container:hover .focus-bracket {
            width: 30px;
            height: 30px;
        }

        .fade-in-step {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.5s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

<!-- TopAppBar Navigation (Suppressed for Transactional/Analysis flow as per logic, keeping it minimal if required but usually suppressed. Keeping a generic header for structure) -->

<script>
        // Simple script to simulate the loading sequence and reveal results
        setTimeout(() => {
            const step4 = document.querySelector('.fade-in-step:nth-child(4)');
            if(step4) {
                const iconContainer = step4.querySelector('.w-8');
                const text = step4.querySelector('p');
                
                // Update Step 4 to complete
                iconContainer.className = 'w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary transition-all duration-300';
                iconContainer.innerHTML = `<span class="material-symbols-outlined text-[18px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>`;
                
                text.className = 'font-body-lg text-body-lg text-on-surface transition-colors duration-300';
                text.textContent = 'Finding similar products';

                // Stop scanning animation
                document.querySelector('.scan-line').style.display = 'none';
                
                // Reveal results
                const finalResults = document.getElementById('final-results');
                finalResults.classList.remove('hidden');
                setTimeout(() => {
                    finalResults.classList.add('opacity-100');
                    finalResults.classList.remove('opacity-0');
                }, 100);
            }
        }, 5000);
    </script>
