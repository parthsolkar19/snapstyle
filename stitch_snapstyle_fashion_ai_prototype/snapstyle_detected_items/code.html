<script>
    const analysis = JSON.parse(
        localStorage.getItem('snapstyleAnalysis')
    );

    const itemsList = document.getElementById('detected-items-list');
const itemsCount = document.getElementById('items-count');
    if (analysis && analysis.items) {
      itemsCount.textContent =
    analysis.items.length + ' ITEMS DETECTED';

        analysis.items.forEach(item => {

            const card = document.createElement('div');

            card.className =
                'bg-surface-container-lowest rounded-lg p-5 mb-4';

            card.innerHTML = `
                <h3 class="text-xl font-bold text-primary mb-2">
                    ${item.type}
                </h3>

                <p class="text-on-surface-variant">
                    Color: ${item.color}
                </p>

                <p class="text-on-surface-variant">
    Style: ${item.style}
</p>

<p class="text-on-surface-variant">
    Material: ${item.material}
</p>

<p class="text-on-surface-variant">
    Pattern: ${item.pattern}
</p>

<p class="text-on-surface-variant">
    Fit: ${item.fit}
</p>
            `;

            itemsList.appendChild(card);
        });

    } else {
        itemsList.innerHTML =
            '<p>No detected items found.</p>';
    }
</script>
